# nginx.conf: serves the built React app
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React Router handles /login and /signup in the browser, so any path
  # that is not a real file falls back to index.html instead of a 404
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite puts a content hash in asset file names, so they can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
